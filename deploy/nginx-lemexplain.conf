# lemexplain.com — frontend + api.lemexplain.com
# cat deploy/nginx-lemexplain.conf > /etc/nginx/sites-available/lemeexp
#
# После certbot --nginx добавится listen 443 ssl. Обязательно добавьте в HTTPS-блок
# api.lemexplain.com те же директивы, что ниже: client_max_body_size и proxy_*_timeout.

# Frontend
server {
    listen 80;
    listen [::]:80;
    server_name lemexplain.com www.lemexplain.com;

    root /var/www/lemeexp/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Backend API
server {
    listen 80;
    listen [::]:80;
    server_name api.lemexplain.com;

    # Без этого nginx отклоняет mp4 с 413 (по умолчанию ~1M). Браузер покажет «CORS error».
    client_max_body_size 2G;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
