# lemexplain.com — frontend + api.lemexplain.com
# cat deploy/nginx-lemexplain.conf > /etc/nginx/sites-available/lemeexp
#
# После certbot --nginx добавится listen 443 ssl. Обязательно добавьте в HTTPS-блок
# api.lemexplain.com те же директивы, что ниже: client_max_body_size и proxy_*_timeout.

# Frontend
server {
    listen 80;
    listen [::]:80;
    server_name lemexplain.com www.lemexplain.com;

    root /var/www/lemeexp/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Android APK — отдача файла, без SPA fallback
    location = /downloads/lemexplain.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="lemexplain.apk"';
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|apk)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Backend API
server {
    listen 80;
    listen [::]:80;
    server_name api.lemexplain.com;

    client_max_body_size 2G;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
